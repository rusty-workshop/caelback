[project]
name = "caelback"
version = "1.0.0"
description = "Snapshot and one-click restore for a Caelestia setup, so you can dotfile-hop and come back to exactly what you had"
readme = "README.md"
authors = [
    { name = "HChaffin", email = "harrisonchaffin@gmail.com" }
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
caelback = "caelback.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
module-name = "caelback"
